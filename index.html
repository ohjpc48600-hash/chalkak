        var b = bin.read();
        if (b == -1) throw 'eof';
        return b;

      var count = 0;
      var unicodeMap = {};
      while (true) {
        var b0 = bin.read();
        if (b0 == -1) break;
        var b1 = read();
        var b2 = read();
        var b3 = read();
        var k = String.fromCharCode( (b0 << 8) | b1);
        var v = (b2 << 8) | b3;
        unicodeMap[k] = v;
        count += 1;
      }
      if (count != numChars) {
        throw count + ' != ' + numChars;
      }

      return unicodeMap;
    }();

    return function(s) {
      var bytes = [];
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charCodeAt(i);
        if (c < 128) {
          bytes.push(c);
        } else {
          var b = unicodeMap[s.charAt(i)];

              bytes.push(b & 0xff);

          }
        }

.stk{position:absolute;line-height:0;transform-origin:center center}
.stk img{display:block;pointer-events:none}
.stk.sel{outline:3px dashed var(--pink);outline-offset:6px;border-radius:6px}
.ovl.locked .stk.sel{outline:none}
.clearall{position:absolute;top:10px;right:10px;background:rgba(17,17,20,.78);color:#fff;border:none;border-radius:999px;padding:8px 16px;font-size:16px;font-weight:700;z-index:3;min-height:44px}
.ctrls{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;flex:none}
.cbtn{min-height:58px;border-radius:14px;border:none;background:var(--soft);color:var(--ink);font-size:15px;font-weight:700;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:4px;line-height:1.1}
.cbtn b{font-size:22px;font-weight:400;font-family:var(--emoji)}
.cbtn[disabled]{opacity:.3}

/* QR·인쇄 */
.qrbox{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;flex:none;background:var(--soft);border-radius:22px;padding:18px}
.qrbox canvas{width:min(62vw,260px);height:auto;image-rendering:pixelated;border-radius:8px}
.qrbox h3{margin:0;font-size:clamp(20px,3.2vw,26px);font-weight:900}
.qrbox p{margin:0;font-size:17px;line-height:1.6;color:var(--muted)}
.qrbox .exp{color:var(--pink);font-weight:900}
.getbtns{display:grid;grid-template-columns:1fr 1fr;gap:10px;flex:none}
.getbtn{min-height:72px;border-radius:18px;border:none;background:var(--soft);color:var(--ink);font-weight:900;font-size:clamp(17px,2.8vw,21px);display:flex;align-items:center;justify-content:center;gap:10px}
.getbtn .ic{font-size:30px;font-family:var(--emoji)}
.spin{width:56px;height:56px;border:8px solid var(--soft2);border-top-color:var(--pink);border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.tip{margin:0;font-size:16px;line-height:1.6;color:var(--muted)}
.autoreset{margin:0;font-weight:900;font-size:18px;color:var(--pink);text-align:center;min-height:1.2em;flex:none}
.bigprint{min-height:110px;font-size:clamp(26px,4.4vw,36px)}
.doneimg{width:100%;height:100%;object-fit:contain}

/* 결제 */
#payPanel{flex:1;position:relative;overflow-y:auto;display:flex;flex-direction:column;gap:12px}
.paybar{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;flex:none}
.payline{background:var(--soft);border-radius:18px;padding:10px 14px;display:flex;flex-direction:column;gap:2px}
.payline span{font-size:16px;color:var(--muted);font-weight:700}
.payline b{font-weight:900;font-size:clamp(24px,4.4vw,40px)}
.payline.em{background:#FFE3EF}
.payline.em span{color:#8A2252}
.payline.em b{color:#C2185B}
.machine{background:#26262E;border-radius:24px;padding:16px;flex:none}
.slot{background:#0F0F14;border-radius:16px;min-height:130px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;
  color:#C9C9D6;border:4px dashed #55556A;padding:12px;transition:background .15s,border-color .15s}
.slot.over{border-color:var(--lime);background:#1F1F2A}
.slot-label{font-weight:900;font-size:clamp(19px,3vw,26px)}
.slot-items{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.chip-m{padding:4px 10px;border-radius:8px;color:#111114;font-weight:900;font-size:17px;border:2px solid #111114}
.wallet{display:flex;flex-wrap:wrap;gap:14px;justify-content:center;align-items:center;padding:8px 0;flex:none}
.wallet-title{text-align:center;font-weight:700;font-size:20px;color:var(--muted);margin:0}
.money{touch-action:none;border:3px solid #111114;font-family:var(--ui);font-weight:900;color:#111114;position:relative;padding:0;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;box-shadow:0 5px 0 rgba(17,17,20,.5)}
.bill{width:clamp(132px,22vw,196px);aspect-ratio:2.1;border-radius:10px;background:var(--c)}
.bill::before{content:"";position:absolute;inset:7px;border:2px dashed rgba(17,17,20,.3);border-radius:6px;pointer-events:none}
.coin{width:clamp(74px,11vw,94px);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,var(--c) 62%)}
.coin.c500{width:clamp(84px,12.5vw,106px)}
.mv{font-size:clamp(22px,3.6vw,32px);line-height:1}
.coin .mv{font-size:clamp(20px,3.2vw,28px)}
.ml{font-size:15px;font-weight:700}
.mw{position:absolute;right:12px;bottom:8px;font-size:11px;opacity:.6;font-weight:500}
.coin .mw{display:none}
.money.off{opacity:.25;filter:grayscale(1);pointer-events:none}
.hint{animation:hintpulse 1s ease-in-out infinite;outline:5px solid var(--pink);outline-offset:5px}
@keyframes hintpulse{50%{transform:scale(1.08)}}
.payfoot{display:flex;justify-content:center;flex:none}
.payfoot .btn{min-height:58px;font-size:20px}
.bigok{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:var(--bg);
  font-weight:900;font-size:clamp(30px,6vw,48px);text-align:center;z-index:5}
.bigok .e{font-size:clamp(80px,16vw,140px);font-family:var(--emoji);animation:pop .6s}
.quizq{text-align:center;font-weight:900;font-size:clamp(22px,4vw,34px);margin:4px 0}
.quiz{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
.quiz .btn{min-width:170px}
.quiz .btn.correct{background:#2FB380;color:#fff}
.quiz .btn.wrong{background:#FFD0D0;color:#111114}
.counting{outline:5px solid var(--lime);outline-offset:4px;transform:scale(1.06)}
.cardzone{display:flex;flex-direction:column;align-items:center;gap:20px;flex:1;justify-content:center}
.reader{width:clamp(220px,36vw,300px);min-height:200px;background:#26262E;border-radius:22px;display:flex;flex-direction:column;align-items:center;gap:12px;padding:16px;color:#fff;font-weight:900;font-size:19px}
.reader .mouth{width:86%;height:24px;background:#0F0F14;border-radius:8px;border:3px dashed #55556A}
.reader.over .mouth{border-color:var(--lime)}
.reader .screen-s{background:#C3F7E1;color:#0E3B2E;border-radius:10px;padding:8px 12px;width:86%;text-align:center;font-size:17px}
.card-item{width:clamp(170px,28vw,236px);aspect-ratio:1.58;border-radius:14px;background:linear-gradient(135deg,#7C5CFF,#FF3D8B);color:#fff;
  border:3px solid #111114;padding:12px 14px;font-weight:900;display:flex;flex-direction:column;justify-content:space-between;align-items:flex-start;touch-action:none;box-shadow:0 5px 0 rgba(17,17,20,.5)}
.card-item .chip-g{width:38px;height:28px;border-radius:6px;background:linear-gradient(135deg,#FFE58A,#D9A72B);border:2px solid #8A6A12}
.card-item .cn{font-size:17px;letter-spacing:.08em}
.card-item.in{width:clamp(150px,24vw,200px)}

/* 대화상자 */
.dlg-back{position:fixed;inset:0;background:rgba(10,10,14,.55);display:grid;place-items:center;z-index:80;padding:16px}
.dlg{background:var(--bg);color:var(--ink);border-radius:28px;padding:24px;width:min(94vw,420px);text-align:center;display:flex;flex-direction:column;gap:14px;max-height:90vh;overflow:auto}
.dlg h3{font-size:26px;font-weight:900;margin:0}
.dlg p{margin:0;font-size:18px;line-height:1.6}
.pindots{display:flex;justify-content:center;gap:14px}
.pindots i{width:20px;height:20px;border-radius:50%;border:3px solid var(--ink);display:block}
.pindots i.f{background:var(--ink)}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.keypad button{min-height:64px;border-radius:16px;border:none;background:var(--soft);color:var(--ink);font-weight:900;font-size:26px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#111114;color:#fff;
  padding:14px 22px;border-radius:16px;font-size:18px;z-index:90;max-width:90vw;text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.3)}
.flyer{position:fixed;z-index:60;pointer-events:none;transition:transform .45s cubic-bezier(.5,0,.3,1),opacity .45s}

/* 설정 */
.settings{position:fixed;inset:0;background:var(--bg);color:var(--ink);z-index:75;overflow-y:auto;-webkit-user-select:text;user-select:text}
.sethead{position:sticky;top:0;background:var(--bg);border-bottom:2px solid var(--line);display:flex;align-items:center;gap:12px;padding:12px 16px;z-index:2}
.sethead{flex-wrap:wrap}
.sethead h2{font-size:26px;font-weight:900;margin:0;flex:1}
.settabs{flex-basis:100%;display:flex;gap:8px;overflow-x:auto;padding:4px 0 2px;scrollbar-width:none}
.settabs::-webkit-scrollbar{display:none}
.settabs button{flex:none;min-height:48px;padding:0 18px;border-radius:999px;border:none;background:var(--soft);color:var(--ink);font-size:16px;font-weight:700}
.settabs button.on{background:var(--primary);color:var(--on-primary)}
.setfoot{text-align:center;color:var(--muted);font-size:14px;margin-top:20px}
.setbody{max-width:760px;margin:0 auto;padding:16px 16px 60px}
.setsec{background:var(--soft);border-radius:20px;padding:16px 18px;margin-bottom:14px}
.setsec h3{font-size:22px;font-weight:900;margin:0 0 6px}
.setdesc{margin:0 0 6px;font-size:15px;color:var(--muted);line-height:1.6}
.tog{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;min-height:56px;padding:8px 2px;background:none;border:none;
  border-bottom:1px solid var(--line);font-size:17px;color:var(--ink);text-align:left;font-weight:500}
.tog i{width:58px;height:34px;border-radius:999px;background:#B5B5C0;position:relative;flex:none;transition:background .15s}
.tog i::after{content:"";position:absolute;top:4px;left:4px;width:26px;height:26px;border-radius:50%;background:#fff;transition:left .15s}
.tog.on i{background:#2FB380}
.tog.on i::after{left:28px}
.segrow{padding:10px 0;border-bottom:1px solid var(--line);font-size:17px}
.seg{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.seg button{min-height:46px;padding:0 14px;border-radius:12px;border:2px solid var(--line);background:var(--bg);color:var(--ink);font-size:15px;font-weight:700}
.seg button.on{background:var(--primary);color:var(--on-primary);border-color:var(--primary)}
.mbtn{min-height:48px;padding:0 16px;border-radius:12px;border:none;background:var(--primary);color:var(--on-primary);font-weight:900;font-size:16px}
.mbtn.plain{background:var(--bg);color:var(--ink);border:2px solid var(--line)}
.mbtn.danger{background:#FFE0E0;color:#8A1010}
.btnrow{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.tinput{width:100%;min-height:50px;border-radius:12px;border:2px solid var(--line);background:var(--bg);color:var(--ink);font-size:17px;padding:0 14px;font-family:var(--ui);margin-top:8px}
.flabel{display:block;font-size:15px;font-weight:700;margin-top:10px}
.alist{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px}
.aitem{width:112px;display:flex;flex-direction:column;gap:6px;align-items:center;font-size:13px;text-align:center}
.aitem img{width:100px;height:120px;object-fit:contain;background:repeating-conic-gradient(#ddd 0 25%,#fff 0 50%) 0 0/16px 16px;border-radius:8px}
.aitem button{min-height:40px;border-radius:10px;border:2px solid var(--line);background:var(--bg);color:var(--ink);padding:0 10px;font-size:14px}
.chipsel{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chipsel button{min-height:42px;padding:0 12px;border-radius:999px;border:2px solid var(--line);background:var(--bg);color:var(--ink);font-size:14px}
.chipsel button.on{background:var(--pink);border-color:var(--pink);color:#fff}
.stat{font-size:20px;font-weight:900;margin:6px 0}
.help p,.help li{font-size:15px;line-height:1.7}
.help ol{padding-left:22px;margin:6px 0 10px}
.help pre{background:var(--bg);border-radius:10px;padding:10px;font-size:13px;white-space:pre-wrap;word-break:break-all;overflow-x:auto}

.subhead{grid-column:1/-1;margin:8px 2px 0;font-size:17px;font-weight:900;color:var(--muted)}
.subhead:first-child{margin-top:0}
.strength{display:flex;align-items:center;gap:10px;flex:none;background:var(--soft);border-radius:18px;padding:8px}
.sbig{width:64px;height:64px;border-radius:16px;border:none;background:var(--primary);color:var(--on-primary);font-size:36px;font-weight:900;flex:none;line-height:1}
.sbar{flex:1;display:flex;flex-direction:column;gap:6px;align-items:center}
.sbar .bar{display:flex;gap:4px;width:100%}
.sbar .bar i{flex:1;height:16px;border-radius:5px;background:var(--soft2)}
.sbar .bar i.f{background:var(--pink)}
.sbar span{font-weight:900;font-size:17px}
.sheettoggle{display:none;min-height:44px;border:none;background:var(--soft);color:var(--ink);border-radius:999px;font-weight:700;font-size:16px;flex:none}
.g-filter.easy{grid-template-columns:repeat(3,1fr)}
.setdesc.warn{color:#B4234F;font-weight:700}
.bigdone{position:absolute;inset:0;background:linear-gradient(160deg,#FFE3EE,#DFF4FF);color:#3A2E4F;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;font-weight:900;font-size:clamp(32px,6vw,52px);z-index:6}
.bigdone .e{font-size:clamp(90px,18vw,160px);font-family:var(--emoji);animation:pop .6s}
#s-out{position:relative}
/* 스마트폰 세로 화면: 선택 칸을 크게 */
@media (orientation:portrait) and (max-width:700px){
  .screen{padding:4px 10px 10px;gap:8px}
  .topbar{min-height:54px}
  .topbar h2{font-size:21px}
  .iconbtn{min-width:52px;height:54px}
  .stepbar{display:none}
  #stuSplit>.stagewrap{flex:0 0 36%}
  #stuSplit>.sheet{flex:1 1 auto}
  #stuSplit.expanded>.stagewrap{display:none}
  .sheettoggle{display:block}
  .maintabs button{min-height:56px;font-size:20px}
  .chips{overflow:visible}
  .chip{flex:1;padding:0 8px;min-height:54px;font-size:18px}
  .g-frames{grid-template-columns:repeat(2,1fr)}
  .g-frames.strip-l{grid-template-columns:repeat(3,1fr)}
  .g-frames .tile img{max-height:30vh;width:auto}
  .g-stk{grid-template-columns:repeat(4,1fr)}
  .g-stk .tile.wide{min-height:80px}
  .g-filter{grid-template-columns:repeat(3,1fr)}
  .ctrls .cbtn{min-height:52px;font-size:13px}
  .btn{min-height:62px}
  .split>.stagewrap{flex:0 0 40%}
}
.stk-h{position:absolute;right:-26px;bottom:-26px;width:48px;height:48px;border-radius:50%;background:var(--pink);color:#fff;display:grid;place-items:center;font-size:26px;line-height:1;font-weight:900;box-shadow:0 3px 10px rgba(0,0,0,.25);border:3px solid #fff}
.ovl.locked .stk-h{display:none}
.stk.adj{outline:4px solid var(--pink)!important;outline-offset:8px}
.stk.adj img{filter:drop-shadow(0 0 8px rgba(255,61,139,.6))}
.has-badge .screen{padding-bottom:86px}
.has-badge #s-start{padding-bottom:0}
.has-badge #s-start .corner{bottom:88px}
.has-badge .copyright{bottom:156px}
.has-badge .start-hit{padding-bottom:190px}
#printArea{display:none}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@page{size:4in 6in;margin:0}
@media print{
  :root{padding:0}
  html,body{background:#fff!important;height:auto;overflow:visible}
  body::before{display:none}
  body>*:not(#printArea){display:none!important}
  #printArea{display:block}
  .ppage{width:4in;height:6in;position:relative;display:flex;page-break-after:always;break-after:page;overflow:hidden}
  .ppage:last-child{page-break-after:auto;break-after:auto}
  .p-full{width:4in;height:6in;display:block}
  .p-strip{width:2in;height:6in;display:block}
  .ppage.cut::after{content:"";position:absolute;left:2in;top:0;bottom:0;border-left:1px dashed #999}
}
</style>
</head>
<body>
<div id="app">
  <div class="stepbar" id="stepbar" aria-hidden="true"></div>

  <section class="screen active" id="s-start">
    <button class="start-hit" id="startBtn" aria-label="시작하기">
      <div class="start-strips" aria-hidden="true">
        <div class="strip s1"><i>😄</i><i>😎</i><i>🥰</i><i>🤪</i></div>
        <div class="strip s2"><i>🐶</i><i>🐱</i><i>🐰</i><i>🐻</i></div>
        <div class="strip s3"><i>⭐</i><i>🌈</i><i>🎈</i><i>🌸</i></div>
      </div>
      <span class="logo">찰칵<br><em>네컷</em></span>
      <span class="start-cta">화면을 눌러 시작해요</span>
      <span class="start-note" id="startNote"></span>
    </button>
    <button class="corner left" id="gearBtn" aria-label="선생님 설정">⚙️ 선생님 설정</button>
    <button class="corner right" id="easyToggle">쉬운 모드 켜기</button>
    <p class="copyright">© 2026 저작권자: 초등 특수교사 오혜주</p>
  </section>

  <section class="screen" id="s-layout">
    <header class="topbar"><h2>사진 모양을 골라요</h2></header>
    <div class="center">
      <div class="choice">
        <button class="ccard" data-layout="2x2"><div class="mini mini-2x2"><i></i><i></i><i></i><i></i></div><b>네모 네 칸</b><small>큰 사진</small></button>
        <button class="ccard" data-layout="1x4"><div class="mini mini-1x4"><i></i><i></i><i></i><i></i></div><b>길쭉한 한 줄</b><small>길쭉한 사진</small></button>
      </div>
    </div>
  </section>

  <section class="screen" id="s-count">
    <header class="topbar"><h2>몇 장 뽑을까요?</h2></header>
    <div class="center"><div class="choice" id="countChoices"></div></div>
  </section>

  <section class="screen" id="s-pay">
    <header class="topbar"><h2 id="payTitle">돈을 내요</h2></header>
    <div id="payPanel"></div>
  </section>

  <section class="screen" id="s-shoot">
    <header class="topbar"><h2 id="shootTitle">사진 6장을 찍어요</h2></header>
    <div class="shootbody">
      <div class="stagewrap" id="camWrap">
        <div class="stage cam" id="camStage">
          <video id="video" playsinline muted autoplay></video>
          <div class="camph" id="camPh" hidden><div class="e">🖼️</div><p id="camPhText"></p></div>
          <div class="count" id="countNum"></div>
          <div class="flash" id="flash"></div>
          <div class="shotlabel" id="shotLabel">준비됐나요?</div>
        </div>
      </div>
      <div class="camerr" id="camErr" hidden>
        <h3>카메라를 켤 수 없어요</h3>
        <p id="camErrText"></p>
        <div class="row"><button class="btn soft" id="camRetry">다시 해 보기</button><button class="btn" id="camOther">갤러리에서 고르기</button></div>
      </div>
      <div class="thumbs6" id="thumbs6"></div>
      <button class="btn wide" id="shootBtn">촬영 시작</button>
      <button class="linkbtn" id="shootAlt" hidden>갤러리에서 고르기</button>
    </div>
  </section>

  <section class="screen" id="s-pick">
    <header class="topbar"><h2>사진 4장을 골라요</h2></header>
    <div class="split">
      <div class="stagewrap"><div class="stage" id="pickStage"><canvas id="pickCanvas"></canvas></div></div>
      <div class="sheet">
        <p class="hintline" id="pickCount">0장 골랐어요</p>
        <div class="scroll"><div class="grid six" id="pickGrid"></div></div>
        <div class="row"><button class="btn soft" id="pickClear">다시 고르기</button><button class="btn" id="pickNext" disabled>다음</button></div>
      </div>
    </div>
  </section>

  <section class="screen" id="s-studio">
    <header class="topbar"><h2 id="stuTitle">프레임을 골라요</h2></header>
    <div class="split" id="stuSplit">
      <div class="stagewrap"><div class="stage" id="stuStage"><canvas id="stuCanvas"></canvas><div class="ovl locked" id="stkOverlay"></div><button class="clearall" id="clearAll" hidden>모두 지우기</button></div></div>
      <div class="sheet">
        <button class="sheettoggle" id="sheetToggle">▲ 목록 크게 보기</button>
        <div class="maintabs" role="tablist" id="mainTabs">
          <button data-t="frame" role="tab">프레임</button><button data-t="sticker" role="tab">스티커</button><button data-t="filter" role="tab">필터</button>

}

const IDB={db:null,
  open(){return new Promise(res=>{try{const r=indexedDB.open('chk4',1);
    r.onupgradeneeded=()=>{const d=r.result;if(!d.objectStoreNames.contains('assets'))d.createObjectStore('assets',{keyPath:'id'});if(!d.objectStoreNames.contains('album'))d.createObjectStore('album',{keyPath:'id'})};

  req(store,mode,fn){return new Promise(res=>{if(!IDB.db)return res(null);try{const q=fn(IDB.db.transaction(store,mode).objectStore(store));q.onsuccess=()=>res(q.result);q.onerror=()=>res(null)}catch(e){res(null)}})},
  all(s){return IDB.req(s,'readonly',o=>o.getAll()).then(r=>r||[])},
  put(s,v){return IDB.req(s,'readwrite',o=>o.put(v))},
  del(s,id){return IDB.req(s,'readwrite',o=>o.delete(id))},
  clear(s){return IDB.req(s,'readwrite',o=>o.clear())},

let AC=null;
function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();return AC}
function tone(freq,dur=.12,vol=.18,type='sine'){const a=ac();if(!a)return;try{const o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.value=freq;
  g.gain.setValueAtTime(vol,a.currentTime);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+dur);o.connect(g).connect(a.destination);o.start();o.stop(a.currentTime+dur)}catch(e){}}

  for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,3);const s=a.createBufferSource();s.buffer=b;const g=a.createGain();g.gain.value=.45;s.connect(g).connect(a.destination);s.start()}catch(e){}}

function geom(layout){
  if(layout==='1x4'){
    const W=600,H=1800,m=36,top=36,gap=20,band=150,cw=W-2*m,ch=(H-top-band-3*gap)/4;
    const cells=[0,1,2,3].map(i=>[m,top+i*(ch+gap)]);
    const bandY=top+4*ch+3*gap;return {W,H,m,top,gap,cw,ch,cells,bandY,bandH:H-bandY};
  }
  const W=1200,H=1800,m=50,top=50,gap=26,band=190,cw=(W-2*m-gap)/2,ch=(H-top-band-gap)/2;
  const cells=[[m,top],[m+cw+gap,top],[m,top+ch+gap],[m+cw+gap,top+ch+gap]];
  const bandY=top+2*ch+gap;return {W,H,m,top,gap,cw,ch,cells,bandY,bandH:H-bandY};
}
function rng(str){let h=1779033703^str.length;for(let i=0;i<str.length;i++){h=Math.imul(h^str.charCodeAt(i),3432918353);h=h<<13|h>>>19}
  let a=h>>>0;return ()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function rr(ctx,x,y,w,h,r){r=Math.max(0,Math.min(r,w/2,h/2));ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}
function drawCover(ctx,img,x,y,w,h){const iw=img.naturalWidth||img.width,ih=img.naturalHeight||img.height;if(!iw||!ih)return;
  const s=Math.max(w/iw,h/ih),sw=w/s,sh=h/s;ctx.drawImage(img,(iw-sw)/2,(ih-sh)/2,sw,sh,x,y,w,h)}

function applyFilter(src,f,lv=7){
  const c=mkC(src.width,src.height),x=c.getContext('2d');x.drawImage(src,0,0);
  const p=f.p,k=clamp(lv,0,10)/10;if(!Object.keys(p).length||k===0)return c;
  let im;try{im=x.getImageData(0,0,c.width,c.height)}catch(e){return c}
  const d=im.data,b=p.b??1,ct=p.c??1,s=p.s??1,gray=p.gray||0,sep=p.sepia||0,tint=p.tint,fade=p.fade||0,grain=p.grain||0;
  const rnd=rng('grain'+c.width);
  for(let i=0;i<d.length;i+=4){
    const r0=d[i],g0=d[i+1],b0=d[i+2];
    let r=r0*b,gg=g0*b,bl=b0*b;
    if(ct!==1){r=(r-128)*ct+128;gg=(gg-128)*ct+128;bl=(bl-128)*ct+128}
    const l=.299*r+.587*gg+.114*bl;
    if(s!==1){r=l+(r-l)*s;gg=l+(gg-l)*s;bl=l+(bl-l)*s}
    if(gray){r=gg=bl=l}
    if(sep){const sr=.393*r+.769*gg+.189*bl,sg=.349*r+.686*gg+.168*bl,sb=.272*r+.534*gg+.131*bl;r+=(sr-r)*sep;gg+=(sg-gg)*sep;bl+=(sb-bl)*sep}
    if(tint){r+=(tint[0]-r)*tint[3];gg+=(tint[1]-gg)*tint[3];bl+=(tint[2]-bl)*tint[3]}
    if(fade){r=fade+r*(255-fade)/255;gg=fade+gg*(255-fade)/255;bl=fade+bl*(255-fade)/255}
    if(grain){const n=(rnd()-.5)*grain;r+=n;gg+=n;bl+=n}
    d[i]=r0+(r-r0)*k;d[i+1]=g0+(gg-g0)*k;d[i+2]=b0+(bl-b0)*k;
  }
  x.putImageData(im,0,0);
  if(p.glow){const s2=mkC(Math.max(1,c.width/8|0),Math.max(1,c.height/8|0)),y2=s2.getContext('2d');
    y2.imageSmoothingQuality='high';y2.drawImage(c,0,0,s2.width,s2.height);x.save();x.globalCompositeOperation='screen';x.globalAlpha=p.glow*k;x.imageSmoothingQuality='high';x.drawImage(s2,0,0,c.width,c.height);x.restore()}
  return c;
}

function fillBg(ctx,W,H,bg){
  if(Array.isArray(bg)){const g=ctx.createLinearGradient(0,0,W*.35,H);bg.forEach((c,i)=>g.addColorStop(i/(bg.length-1),c));ctx.fillStyle=g}else ctx.fillStyle=bg;
  ctx.fillRect(0,0,W,H);
}
function drawPattern(ctx,W,H,p,seed,g){
  if(!p)return;ctx.save();const rnd=rng(seed);
  const inCaption=(x,y)=>y>g.bandY-10&&Math.abs(x-W/2)<W*.3;
  switch(p.t){
    case 'dots':ctx.fillStyle=p.c;for(let y=p.s/2,row=0;y<H+p.s;y+=p.s,row++)for(let x=row%2?0:p.s/2;x<W+p.s;x+=p.s){ctx.beginPath();ctx.arc(x,y,p.r,0,Math.PI*2);ctx.fill()}break;
    case 'stripes':ctx.lineWidth=p.s/2;for(let i=-H,k=0;i<W+H;i+=p.s/2,k++){ctx.strokeStyle=k%2?p.c:(p.c2||p.c);ctx.beginPath();ctx.moveTo(i,0);ctx.lineTo(i+H*.6,H);ctx.stroke()}break;
    case 'check':ctx.fillStyle=p.c;for(let y=0,r=0;y<H;y+=p.s,r++)for(let x=0,c=0;x<W;x+=p.s,c++)if((r+c)%2===0)ctx.fillRect(x,y,p.s,p.s);break;
    case 'lines':ctx.strokeStyle=p.c;ctx.lineWidth=3;for(let y=p.s;y<H;y+=p.s){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}
      ctx.strokeStyle=p.m;ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(g.m*.5,0);ctx.lineTo(g.m*.5,H);ctx.stroke();break;
    case 'grid':ctx.strokeStyle=p.c;ctx.lineWidth=2;for(let y=p.s;y<H;y+=p.s){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}
      for(let x=p.s;x<W;x+=p.s){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke()}break;
    case 'bands':{const bh=H*.013;p.cs.forEach((c,i)=>{ctx.fillStyle=c;ctx.fillRect(0,H-bh*(3-i)-bh*.6,W,bh)})}break;
    case 'film':{const hw=g.m*.38,hh=hw*1.35,x1=g.m*.31,x2=W-g.m*.31-hw;ctx.fillStyle='#F2F2F2';
      for(let y=hh*.6;y<H;y+=hh*2){rr(ctx,x1,y,hw,hh,hw*.25);ctx.fill();rr(ctx,x2,y,hw,hh,hw*.25);ctx.fill()}}break;
    case 'chalk':{ctx.strokeStyle='rgba(255,255,255,.07)';for(let i=0;i<60;i++){ctx.lineWidth=4+rnd()*14;const x=rnd()*W,y=rnd()*H;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+(rnd()-.5)*300,y+(rnd()-.5)*80);ctx.stroke()}
      ctx.fillStyle='rgba(255,255,255,.5)';ctx.textAlign='center';ctx.textBaseline='middle';
      for(let i=0;i<22;i++){const x=rnd()*W,y=rnd()*H;if(inCaption(x,y))continue;ctx.font=`${W*(.035+rnd()*.03)}px Jua, sans-serif`;ctx.fillText(['☆','♡','○','✓'][i%4],x,y)}}break;
    case 'scatter':{ctx.textAlign='center';ctx.textBaseline='middle';ctx.globalAlpha=p.a;let placed=0,tries=0;
      while(placed<p.n&&tries<p.n*4){tries++;const x=rnd()*W,y=rnd()*H;if(inCaption(x,y))continue;const s=W*(.045+rnd()*.05);
        ctx.save();ctx.translate(x,y);ctx.rotate((rnd()-.5)*.9);ctx.font=`${s}px ${EMO}`;ctx.fillText(p.e[placed%p.e.length],0,0);ctx.restore();placed++}}break;
  }
  ctx.restore();
}
/* 프레임 + 사진 + 글자를 한 캔버스에 그리기 */
function drawComposite(ctx,layout,frame,slots,o={}){
  const g=geom(layout),W=g.W,H=g.H,strip=layout==='1x4',k=strip?.7:1;
  ctx.save();
  if(frame.up){ctx.fillStyle='#FFFFFF';ctx.fillRect(0,0,W,H);if(frame.upType==='bg'&&frame.img)drawCover(ctx,frame.img,0,0,W,H)}
  else{
    fillBg(ctx,W,H,frame.bg);drawPattern(ctx,W,H,frame.pat,frame.id+'|'+layout,g);
    if(frame.border){const bw=frame.border.w*(strip?.6:1);ctx.strokeStyle=frame.border.c;ctx.lineWidth=bw;ctx.strokeRect(bw/2,bw/2,W-bw,H-bw)}
  }
  const cs=frame.cell||{r:8};
  g.cells.forEach(([x,y],i)=>{
    const sw=(cs.sw||0)*k,r=(cs.r||0)*k;
    if(sw||cs.shadow){ctx.save();if(cs.shadow){ctx.shadowColor='rgba(0,0,0,.28)';ctx.shadowBlur=20*k;ctx.shadowOffsetY=6*k}
      ctx.fillStyle=cs.stroke||'#FFFFFF';rr(ctx,x-sw,y-sw,g.cw+2*sw,g.ch+2*sw,r+sw);ctx.fill();ctx.restore()}
    ctx.save();rr(ctx,x,y,g.cw,g.ch,r);ctx.clip();
    const im=slots&&slots[i];
    if(im)ctx.drawImage(im,x,y,g.cw,g.ch);
    else{
      ctx.fillStyle=o.emptyColor||'#DDE0F5';ctx.fillRect(x,y,g.cw,g.ch);ctx.textAlign='center';ctx.textBaseline='middle';
      if(o.slotNumbers){ctx.fillStyle='rgba(22,24,58,.32)';ctx.font=`${g.ch*.42}px Jua, sans-serif`;ctx.fillText(String(i+1),x+g.cw/2,y+g.ch/2)}
      else if(o.emptyIcon){ctx.globalAlpha=.45;ctx.font=`${Math.min(g.cw,g.ch)*.3}px ${EMO}`;ctx.fillText('📷',x+g.cw/2,y+g.ch/2);ctx.globalAlpha=1}
    }
    ctx.restore();
  });
  if(frame.up&&frame.upType==='overlay'&&frame.img)ctx.drawImage(frame.img,0,0,W,H);
  if(!(frame.up&&frame.upType==='overlay')){
    const by=g.bandY,bh=g.bandH,tsz=strip?46:76,dsz=strip?22:34,title=o.title||'',date=o.date||'';
    const tc=frame.up?'#FFFFFF':(frame.tc||'#3A2E4F');
    ctx.textAlign='center';ctx.textBaseline='middle';
    if(frame.up){ctx.shadowColor='rgba(0,0,0,.55)';ctx.shadowBlur=10}
    if(title){fitText(ctx,title,W/2,by+bh*(date?.4:.5),W-2*g.m,tsz,"Jua, sans-serif",tc)}
    if(date){ctx.globalAlpha=.8;ctx.font=`700 ${dsz}px 'Noto Sans KR', sans-serif`;if('letterSpacing' in ctx)ctx.letterSpacing=(strip?3:6)+'px';ctx.fillStyle=tc;
      ctx.fillText(date,W/2,by+bh*(title?.77:.5));if('letterSpacing' in ctx)ctx.letterSpacing='0px';ctx.globalAlpha=1}
    ctx.shadowBlur=0;ctx.shadowColor='transparent';
  }
  if(o.highlight!=null&&g.cells[o.highlight]){const [x,y]=g.cells[o.highlight];
    ctx.lineWidth=strip?12:16;ctx.strokeStyle='#FFD84A';rr(ctx,x-8,y-8,g.cw+16,g.ch+16,14);ctx.stroke();ctx.lineWidth=strip?4:6;ctx.strokeStyle='#FF5DA2';ctx.stroke()}
  ctx.restore();
}

/* ========== 스티커 만들기 (아기자기 스타일) ========== */
function measure(font,text){const x=mkC(4,4).getContext('2d');x.font=font;return x.measureText(text).width}
const JUA=s=>`${s}px Jua, sans-serif`;
const HAND=s=>`700 ${s}px Gaegu, Jua, sans-serif`;
const SANS=s=>`900 ${s}px 'Noto Sans KR', sans-serif`;
function dotDate(){const d=new Date();return d.getFullYear()+'.'+pad2(d.getMonth()+1)+'.'+pad2(d.getDate())}
// 파스텔 색: [채움, 진한 색]
const PAL={pink:['#FF9EC7','#E8578F'],peach:['#FFC09A','#E57A4E'],butter:['#FFE27A','#D9A21F'],mint:['#8FE3C4','#2FA57C'],
  sky:['#9CCFFF','#3F86D9'],lilac:['#C9B4FF','#7E5FE0'],cream:['#FFF6E3','#C9A46B'],white:['#FFFFFF','#B9A8D9']};
// 스티커처럼 하얀 테두리와 그림자 두르기
function stickerize(src,bw=12,shadow=true){
  const pad=bw+14,c=mkC(src.width+pad*2,src.height+pad*2),x=c.getContext('2d');
  const sil=mkC(c.width,c.height),sx=sil.getContext('2d');
  [bw,bw*.55].forEach(rad=>{for(let a=0;a<20;a++){const t=a/20*Math.PI*2;sx.drawImage(src,pad+Math.cos(t)*rad,pad+Math.sin(t)*rad)}});
  sx.drawImage(src,pad,pad);sx.globalCompositeOperation='source-in';sx.fillStyle='#FFFFFF';sx.fillRect(0,0,c.width,c.height);
  if(shadow){x.save();x.shadowColor='rgba(90,60,130,.28)';x.shadowBlur=12;x.shadowOffsetY=6;x.drawImage(sil,0,0);x.restore()}else x.drawImage(sil,0,0);
  x.drawImage(src,pad,pad);return c;
}
function withShadow(src){const pad=16,c=mkC(src.width+pad*2,src.height+pad*2),x=c.getContext('2d');
  x.shadowColor='rgba(90,60,130,.25)';x.shadowBlur=12;x.shadowOffsetY=6;x.drawImage(src,pad,pad);return c}
function face(x,cx,cy,s,ink='#5A3D55'){
  x.fillStyle=ink;[-1,1].forEach(d=>{x.beginPath();x.ellipse(cx+d*s*.32,cy-s*.05,s*.075,s*.1,0,0,Math.PI*2);x.fill()});
  x.strokeStyle=ink;x.lineWidth=s*.07;x.lineCap='round';x.beginPath();x.arc(cx,cy+s*.08,s*.13,.15*Math.PI,.85*Math.PI);x.stroke();
  x.fillStyle='rgba(255,120,160,.55)';[-1,1].forEach(d=>{x.beginPath();x.ellipse(cx+d*s*.5,cy+s*.12,s*.11,s*.07,0,0,Math.PI*2);x.fill()});
}
function miniHeart(x,cx,cy,s,col){x.fillStyle=col;x.beginPath();x.moveTo(cx,cy+s*.35);x.bezierCurveTo(cx-s*.6,cy-s*.05,cx-s*.3,cy-s*.6,cx,cy-s*.22);x.bezierCurveTo(cx+s*.3,cy-s*.6,cx+s*.6,cy-s*.05,cx,cy+s*.35);x.fill()}
function miniStar(x,cx,cy,R,col){x.fillStyle=col;x.beginPath();for(let i=0;i<8;i++){const a=i*Math.PI/4-Math.PI/2,r=i%2?R*.3:R;x.lineTo(cx+Math.cos(a)*r,cy+Math.sin(a)*r)}x.closePath();x.fill()}
const SK={
  // 몽글몽글 입체 글씨
  puffy(t,p,deco){const [fill,deep]=PAL[p],fs=150,f=JUA(fs),tw=measure(f,t),c=mkC(tw+110,fs*1.6),x=c.getContext('2d'),cx=c.width/2,cy=c.height/2+fs*.02;

function lensPath(x,type){
  x.beginPath();
  if(type==='heart'){x.moveTo(0,46);x.bezierCurveTo(-78,-2,-50,-62,0,-26);x.bezierCurveTo(50,-62,78,-2,0,46);}
  else if(type==='cat'){x.moveTo(-64,-30);x.quadraticCurveTo(0,-36,54,-22);x.quadraticCurveTo(64,22,12,36);x.quadraticCurveTo(-42,38,-58,2);x.quadraticCurveTo(-64,-14,-64,-30);}
  else if(type==='oval')x.ellipse(0,0,58,40,0,0,Math.PI*2);
  else if(type==='round')x.arc(0,0,50,0,Math.PI*2);
  else if(type==='square')rr(x,-60,-42,120,84,14);
  else if(type==='wellington'){x.moveTo(-60,-34);x.lineTo(58,-34);x.quadraticCurveTo(62,28,22,38);x.lineTo(-26,38);x.quadraticCurveTo(-62,30,-60,-34);}
  else if(type==='bug')x.ellipse(0,0,66,54,0,0,Math.PI*2);
  x.closePath();
}
SK.glasses=o=>{
  const W=360,H=170,cy=88,c=mkC(W,H),x=c.getContext('2d'),fw=o.fw||14,F=mkC(W,H),f=F.getContext('2d');
  const each=(ctx,fn)=>[-1,1].forEach(d=>{ctx.save();ctx.translate(180+d*88,cy);if(d>0)ctx.scale(-1,1);fn(ctx,d);ctx.restore()});
  // 테
  f.strokeStyle=o.frame;f.lineWidth=fw*2;f.lineJoin='round';each(f,ctx=>{lensPath(ctx,o.lens);ctx.stroke()});
  f.lineCap='round';f.lineWidth=fw*.9;f.beginPath();f.moveTo(180-36,cy-18);f.quadraticCurveTo(180,cy-34,180+36,cy-18);f.stroke();
  f.lineWidth=fw*.8;f.beginPath();f.moveTo(12,cy-22);f.lineTo(40,cy-24);f.moveTo(W-12,cy-22);f.lineTo(W-40,cy-24);f.stroke();
  if(o.pattern){f.save();f.globalCompositeOperation='source-atop';f.fillStyle=o.pat;
    if(o.pattern==='stripe'){for(let y=0;y<H;y+=12)f.fillRect(0,y,W,6)}
    else if(o.pattern==='dots'){for(let y=6;y<H;y+=14)for(let xx=(y/14|0)%2?6:13;xx<W;xx+=14){f.beginPath();f.arc(xx,y,3,0,Math.PI*2);f.fill()}}
    f.restore()}
  if(o.shine){f.save();f.globalCompositeOperation='source-atop';f.strokeStyle='rgba(255,255,255,.45)';f.lineWidth=4;each(f,ctx=>{ctx.beginPath();ctx.arc(0,0,48,1.15*Math.PI,1.55*Math.PI);ctx.stroke()});f.restore()}
  x.drawImage(F,0,0);
  // 알
  each(x,ctx=>{lensPath(ctx,o.lens);
    if(o.dark){ctx.fillStyle='#141414';ctx.fill();ctx.save();ctx.clip();ctx.fillStyle='rgba(255,255,255,.28)';ctx.beginPath();ctx.ellipse(-22,-14,16,9,-.5,0,Math.PI*2);ctx.fill();ctx.restore()}
    else if(o.tint){ctx.fillStyle=o.tint;ctx.fill()}
    if(o.shutter){ctx.save();ctx.clip();ctx.fillStyle=o.frame;for(let y=-50;y<56;y+=13)ctx.fillRect(-80,y,160,6);ctx.restore()}});
  return withShadow(c);
};

function hairPaint(x,col,W,H){
  if(col==='rainbow'){const g=x.createLinearGradient(0,40,0,H);['#FFB3D1','#FFD1A8','#FFF1A8','#BDF0D6','#B8DCFF','#D3C2FF'].forEach((c,i)=>g.addColorStop(i/5,c));return g}

}

function openCamera(){
  if(camLive()&&CAM.facing===SET.camera){attachVideo();return Promise.resolve('ok')}
  if(CAM.pending)return CAM.pending;
  CAM.pending=(async()=>{
    try{
      if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)return 'unsupported';
      stopCamera();
      const key='chk4-cam-'+SET.camera;let saved=null;try{saved=localStorage.getItem(key)}catch(e){}
      const size={width:{ideal:1280},height:{ideal:960}};
      const tries=[];if(saved)tries.push({deviceId:{exact:saved},...size});tries.push({facingMode:SET.camera,...size},true);
      let last='error';
      for(const v of tries){
        try{
          const s=await navigator.mediaDevices.getUserMedia({video:v,audio:false});
          CAM.stream=s;CAM.facing=SET.camera;
          const t=s.getVideoTracks()[0],id=t&&t.getSettings?t.getSettings().deviceId:null;if(id){try{localStorage.setItem(key,id)}catch(e){}}
          attachVideo();return 'ok';
        }catch(e){last=e&&e.name||'error';if(last==='NotAllowedError'||last==='SecurityError')break}
      }
      return last;
    }finally{CAM.pending=null}
  })();

}

(function stickerGestures(){
  const ov=$('#stkOverlay'),ptrs=new Map();let gest=null,lpT=null;
  const center=s=>{const r=ov.getBoundingClientRect();return {x:r.left+s.x*r.width,y:r.top+s.y*r.height}};
  const adjust=(s,p)=>{const c=center(s);return {type:'adjust',s,c,d0:Math.max(Math.hypot(p.x-c.x,p.y-c.y),36),a0:Math.atan2(p.y-c.y,p.x-c.x),s0:s.s,r0:s.r,moved:true}};
  const setAdj=on=>{const d=$('.stk.sel',ov);if(d)d.classList.toggle('adj',on)};
  ov.addEventListener('pointerdown',e=>{
    try{ov.setPointerCapture(e.pointerId)}catch(_){}
    const p={x:e.clientX,y:e.clientY};ptrs.set(e.pointerId,p);clearTimeout(lpT);
    if(ptrs.size===1){
      const t=e.target.closest('.stk'),h=e.target.closest('.stk-h');
      if(t){S.selStk=t.dataset.id;const s=curStk();pushHist();renderStickers();
        if(h){gest=adjust(s,p);setAdj(true)}
        else{gest={type:'drag',s,sx:p.x,sy:p.y,ox:s.x,oy:s.y,moved:false,last:p};
          lpT=setTimeout(()=>{if(gest&&gest.type==='drag'&&!gest.moved){gest=adjust(s,gest.last);setAdj(true);try{navigator.vibrate&&navigator.vibrate(25)}catch(_){}
            toast('손가락을 움직이면 크기와 각도가 바뀌어요',1800)}},450)}}
      else{S.selStk=null;gest=null;renderStickers()}
    }else if(ptrs.size===2&&curStk()){const [a,b]=[...ptrs.values()],s=curStk();if(!gest)pushHist();
      gest={type:'pinch',s,d0:Math.hypot(b.x-a.x,b.y-a.y)||1,a0:Math.atan2(b.y-a.y,b.x-a.x),s0:s.s,r0:s.r,moved:true}}
  });
  ov.addEventListener('pointermove',e=>{
    if(!ptrs.has(e.pointerId))return;const p={x:e.clientX,y:e.clientY};ptrs.set(e.pointerId,p);if(!gest)return;
    if(gest.type==='drag'&&ptrs.size===1){gest.last=p;const rect=ov.getBoundingClientRect(),px=p.x-gest.sx,py=p.y-gest.sy;
      if(!gest.moved&&Math.hypot(px,py)<8)return;gest.moved=true;clearTimeout(lpT);
      gest.s.x=clamp(gest.ox+px/rect.width,0,1);gest.s.y=clamp(gest.oy+py/rect.height,0,1);updateStk(gest.s)}
    else if(gest.type==='adjust'){const c=gest.c;gest.s.s=clamp(gest.s0*Math.hypot(p.x-c.x,p.y-c.y)/gest.d0,.05,.95);gest.s.r=gest.r0+(Math.atan2(p.y-c.y,p.x-c.x)-gest.a0);updateStk(gest.s)}
    else if(gest.type==='pinch'&&ptrs.size>=2){const [a,b]=[...ptrs.values()];gest.s.s=clamp(gest.s0*Math.hypot(b.x-a.x,b.y-a.y)/gest.d0,.05,.95);
      gest.s.r=gest.r0+(Math.atan2(b.y-a.y,b.x-a.x)-gest.a0);updateStk(gest.s)}
  });
  const end=e=>{ptrs.delete(e.pointerId);clearTimeout(lpT);
    if(ptrs.size===0){if(gest&&gest.type==='drag'&&!gest.moved)S.hist.pop();else if(gest)S.dirty=true;gest=null;renderStickers()}
    else if(gest&&gest.type==='pinch')gest=null};
  ov.addEventListener('pointerup',end);ov.addEventListener('pointercancel',end);
  ov.addEventListener('contextmenu',e=>e.preventDefault());
})();

function promptTarget(){

    seg2(s,[['overlay-2x2','완성 프레임 (네모 네 칸)'],['overlay-1x4','완성 프레임 (길쭉한 한 줄)'],['bg','배경 이미지 (두 모양 모두)']]);
    const fr=el('div',{class:'btnrow'});s.append(fr);
    btn(fr,'이미지 올리기',()=>pickFiles(false,files=>uploadFrame(files[0])));
    btn(fr,'가이드 받기 (네모 네 칸)',()=>downloadGuide('2x2'),'plain');btn(fr,'가이드 받기 (길쭉한 한 줄)',()=>downloadGuide('1x4'),'plain');
    assetList(s,'frame');
    s=sec('우리 학교 스티커','올린 스티커는 꾸미기 카테고리 맨 앞에 보여요. 배경이 투명한 PNG가 가장 예뻐요.');
    btn(s,'스티커 올리기 (여러 장 가능)',()=>pickFiles(true,files=>uploadStickers(files)));
    assetList(s,'sticker');
  }
  if(P==='event'){
    s=sec('행사');
    seg(s,'마지막 화면에서 처음으로','autoReset',[[0,'자동으로 안 돌아감'],[30,'30초 뒤'],[45,'45초 뒤'],[60,'60초 뒤'],[90,'90초 뒤']]);
    s.append(el('p',{class:'stat',text:`오늘 만든 사진: ${getCount()}번`}));
    btn(s,'오늘 횟수 0으로',()=>{try{localStorage.removeItem(countKey())}catch(e){}renderSettings()},'plain');
    s=sec('행사 앨범','켜 두면 완성된 네컷 사진만 이 기기에 모아 둬요. 사진 활용 동의를 받은 행사에서만 켜고, 끝나면 내려받은 뒤 비워 주세요.');
    tog(s,'행사 앨범에 모으기','album');
    s.append(el('p',{class:'stat',text:`모인 사진: ${await IDB.count('album')}장`}));
    const ar=el('div',{class:'btnrow'});s.append(ar);
    btn(ar,'모두 내려받기 (ZIP)',downloadAlbum);
    btn(ar,'앨범 비우기',async()=>{if(!await askConfirm('앨범의 사진을 모두 지울까요? 되돌릴 수 없어요.'))return;await IDB.clear('album');renderSettings()},'danger');
  }
  if(P==='safe'){
    s=sec('보안과 백업','설정 번호를 바꾸거나, 설정과 우리 학교 이미지를 파일로 옮길 수 있어요.');
    const pi=el('input',{class:'tinput',type:'tel',inputmode:'numeric',maxlength:'4',placeholder:'새 설정 번호 4자리 (지금: '+SET.pin+')'});s.append(pi);
    const br=el('div',{class:'btnrow'});s.append(br);
    btn(br,'번호 바꾸기',()=>{if(!/^\d{4}$/.test(pi.value)){toast('숫자 4자리를 넣어 주세요');return}SET.pin=pi.value;saveSettings();toast('설정 번호를 바꿨어요');renderSettings()});
    btn(br,'백업 파일 내보내기',exportBackup,'plain');
    btn(br,'백업 파일 불러오기',()=>pickFiles(false,files=>importBackup(files[0]),'.json,application/json'),'plain');
  }
  if(P==='help'){
    s=sec('도움말');s.classList.add('help');
    para(s,'설정 열기','시작 화면 왼쪽 아래 선생님 설정 버튼을 누르고 번호를 넣어요. 처음 번호는 0000이니 꼭 바꿔 주세요.');
    para(s,'다른 선생님과 나누기','이 HTML 파일을 Netlify 같은 웹 호스팅에 한 번 올리고 그 주소를 나눠요. 받는 선생님은 계정 없이 크롬에서 주소만 열면 돼요. 설정과 우리 학교 이미지는 기기마다 따로 저장돼요.');
    para(s,'앱처럼 쓰기','크롬 메뉴에서 홈 화면에 추가를 누르면 전체 화면으로 열려요. 같은 주소로 열어야 카메라 허용이 기억돼요. 갤럭시 설정의 앱 고정을 켜면 학생이 실수로 앱을 나가지 못해요.');
    para(s,'카메라 허용','처음 허용 창에서 앱 사용 중 허용(계속 허용)을 고르면 다음부터 묻지 않아요. 차단했다면 주소창 왼쪽 아이콘 → 권한에서 카메라를 허용으로 바꿔요.');
    para(s,'개인정보','찍은 사진은 이 기기 안에서 처리되고 처음 화면으로 돌아가면 지워져요. QR을 켠 경우에만 완성 사진이 외부 임시 보관 서비스에 12시간 올라가요.');
    s=sec('만든 사람');
    s.append(el('p',{class:'stat',text:'저작권자: 초등 특수교사 오혜주'}),el('p',{class:'setdesc',text:'찰칵 네컷은 특수교육대상학생의 지역사회 이용 기술과 화폐 사용 학습을 위해 만든 교육용 웹앱이에요.'}));
  }
  body.append(el('p',{class:'setfoot',text:'© 2026 찰칵 네컷 · 저작권자: 초등 특수교사 오혜주'}));
  $('#settings').scrollTop=keep;
}
function seg2(p,opts){const g=el('div',{class:'seg'});opts.forEach(([v,l])=>{const b=el('button',{class:upType===v?'on':'',text:l});
  b.onclick=()=>{upType=v;[...g.children].forEach(c=>c.classList.remove('on'));b.classList.add('on')};g.append(b)});p.append(g)}
function assetList(p,kind){
  const list=ASSETS.filter(a=>a.kind===kind);const box=el('div',{class:'alist'});p.append(box);
  if(!list.length){box.append(el('p',{class:'setdesc',text:'아직 올린 이미지가 없어요.'}));return}
  list.forEach(a=>{const label=kind==='frame'?(a.upType==='bg'?'배경':a.layout==='2x2'?'네모 네 칸':'길쭉한 한 줄'):'';
    const del=el('button',{text:'지우기'});del.onclick=async()=>{if(!await askConfirm(a.name+'을(를) 지울까요?'))return;await IDB.del('assets',a.id);
      ASSETS=ASSETS.filter(x=>x.id!==a.id);SET.easyFrames=SET.easyFrames.filter(id=>id!==a.id);saveSettings();THUMBS.clear();renderSettings()};
    box.append(el('div',{class:'aitem'},[el('img',{src:a.data,alt:''}),el('span',{text:a.name+(label?' ('+label+')':'')}),del]))});
}
function pickFiles(multi,cb,accept='image/*'){
  const i=el('input',{type:'file',accept});if(multi)i.multiple=true;i.style.display='none';document.body.append(i);
  i.onchange=()=>{const f=[...i.files];i.remove();if(f.length)cb(f)};i.click();
}
function readFileImage(file){return new Promise(res=>{const fr=new FileReader();fr.onload=async()=>res(await loadImage(fr.result));fr.onerror=()=>res(null);fr.readAsDataURL(file)})}
async function uploadFrame(file){
  const img=await readFileImage(file);if(!img){toast('이미지를 읽지 못했어요');return}
  const n=ASSETS.filter(a=>a.kind==='frame').length+1;let data,layout='any',type;
  if(upType==='bg'){type='bg';const c=document.createElement('canvas');c.width=1200;c.height=1800;drawCover(c.getContext('2d'),img,0,0,1200,1800);data=c.toDataURL('image/jpeg',.9)}
  else{type='overlay';layout=upType.endsWith('1x4')?'1x4':'2x2';const g=geom(layout),c=document.createElement('canvas');c.width=g.W;c.height=g.H;
    c.getContext('2d').drawImage(img,0,0,g.W,g.H);data=c.toDataURL('image/png')}
  const a={id:'u'+Date.now().toString(36),kind:'frame',upType:type,layout,name:'우리 학교 '+n,data,t:Date.now()};
  const ok=await IDB.put('assets',a);if(ok===null){toast('저장 공간에 넣지 못했어요');return}
  a.img=await loadImage(data);ASSETS.push(a);THUMBS.clear();toast('프레임을 올렸어요');renderSettings();
}
async function uploadStickers(files){
  let k=0;
  for(const f of files){const img=await readFileImage(f);if(!img)continue;
    const sc=Math.min(1,400/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.max(1,Math.round(img.width*sc));c.height=Math.max(1,Math.round(img.height*sc));
    c.getContext('2d').drawImage(img,0,0,c.width,c.height);const data=c.toDataURL('image/png');
    const a={id:'s'+Date.now().toString(36)+k,kind:'sticker',name:'스티커 '+(ASSETS.filter(x=>x.kind==='sticker').length+1),data,t:Date.now()+k};
    if(await IDB.put('assets',a)===null)continue;a.img=await loadImage(data);ASSETS.push(a);k++}
  toast(k?`스티커 ${k}개를 올렸어요`:'스티커를 올리지 못했어요');renderSettings();
}
async function downloadGuide(layout){
  const g=geom(layout),c=document.createElement('canvas');c.width=g.W;c.height=g.H;const x=c.getContext('2d');
  x.fillStyle='#FFFFFF';x.fillRect(0,0,g.W,g.H);x.textAlign='center';x.textBaseline='middle';
  g.cells.forEach(([cx,cy],i)=>{x.fillStyle='#E4E7FF';x.fillRect(cx,cy,g.cw,g.ch);x.strokeStyle='#FF5DA2';x.lineWidth=4;x.setLineDash([16,10]);x.strokeRect(cx,cy,g.cw,g.ch);x.setLineDash([]);
    x.fillStyle='#4F5480';x.font=`${layout==='2x2'?40:30}px Jua, sans-serif`;x.fillText(`사진 칸 ${i+1}`,cx+g.cw/2,cy+g.ch/2-24);
    x.font=`${layout==='2x2'?26:20}px sans-serif`;x.fillText(`이 자리를 투명하게 (${Math.round(g.cw)}×${Math.round(g.ch)}px)`,cx+g.cw/2,cy+g.ch/2+24)});
  x.fillStyle='#16183A';x.font=`${layout==='2x2'?34:22}px Jua, sans-serif`;
  x.fillText(`전체 ${g.W}×${g.H}px, PNG로 저장`,g.W/2,g.bandY+g.bandH/2);
  const blob=await new Promise(r=>c.toBlob(r,'image/png'));const r=await saveFile(`프레임가이드_${layout==='2x2'?'네모네칸':'길쭉한한줄'}.png`,blob);
  if(r==='fail')toast('가이드를 저장하지 못했어요');
}
async function downloadAlbum(){
  const list=await IDB.all('album');if(!list.length){toast('앨범이 비어 있어요');return}
  if(typeof JSZip==='undefined'){toast('ZIP 기능을 불러오지 못했어요. 인터넷 연결을 확인해 주세요.');return}
  toast('ZIP 파일을 만들고 있어요…',6000);
  const z=new JSZip();list.sort((a,b)=>a.t-b.t).forEach((a,i)=>{const d=new Date(a.t);z.file(`${String(i+1).padStart(3,'0')}_${pad2(d.getHours())}${pad2(d.getMinutes())}${pad2(d.getSeconds())}.png`,a.blob)});
  const blob=await z.generateAsync({type:'blob'});const r=await saveFile(`찰칵네컷_앨범_${todayKey()}.zip`,blob);
  if(r==='saved')toast('앨범을 내려받았어요');else if(r==='fail')toast('내려받지 못했어요');
}
async function exportBackup(){
  const assets=ASSETS.map(({img,...rest})=>rest);
  const blob=new Blob([JSON.stringify({app:'chalkak4',v:1,settings:SET,assets})],{type:'application/json'});
  const r=await saveFile(`찰칵네컷_설정백업_${todayKey()}.json`,blob);if(r==='saved')toast('백업 파일을 내보냈어요');
}
async function importBackup(file){
  try{const j=JSON.parse(await file.text());if(j.app!=='chalkak4')throw 0;
    if(!await askConfirm('백업 파일의 설정과 이미지를 불러올까요? 지금 설정은 바뀌어요.'))return;
    SET={...DEF,...j.settings};saveSettings();
    for(const a of (j.assets||[])){if(a&&a.id&&a.data&&(a.kind==='frame'||a.kind==='sticker'))await IDB.put('assets',a)}
    await loadAssets();THUMBS.clear();toast('백업을 불러왔어요');renderSettings();
  }catch(e){toast('찰칵 네컷 백업 파일이 아니에요')}
}



/* ========== 시작하기 ========== */
if(/\.netlify\.app$/i.test(location.hostname))document.documentElement.classList.add('has-badge');
(async function boot(){
  await IDB.open();await loadAssets();
  try{const T=ALL_TEXT+(SET.frameTitle||'');await Promise.race([Promise.all([document.fonts.load('80px Jua',T),document.fonts.load("900 30px 'Noto Sans KR'",T),
    document.fonts.load("700 80px 'Noto Sans KR'",T),document.fonts.load("700 80px Gaegu",T)]),sleep(3500)])}catch(e){}
  go('s-start');
  try{if(navigator.permissions){const p=await navigator.permissions.query({name:'camera'});if(p.state==='granted')openCamera()}}catch(e){}
})();
</script>
